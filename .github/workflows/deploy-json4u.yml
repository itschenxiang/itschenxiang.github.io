name: Deploy json4u to Pages

on:
  push:
    branches:
      - source
    paths:
      - 'next.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'public/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Push to main branch
        run: |
          git fetch origin main
          git checkout origin/main -b target
          rm -rf json4u
          mkdir -p json4u
          cp -r out/* json4u/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json4u
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "deploy json4u $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin target:main
